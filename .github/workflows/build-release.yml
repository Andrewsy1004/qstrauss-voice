name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── macOS Build ──────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow
          pip install pyobjc-framework-Cocoa pyobjc-framework-WebKit pyobjc-framework-Quartz

      - name: Build, sign and package
        run: |
          ./build_mac.sh
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: QStrauss-Voice-mac.zip

  # ── Windows Build ────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install faster-whisper sounddevice pyperclip pynput numpy scipy
          pip install pyinstaller Pillow pystray

      - name: Generate Windows icon
        run: |
          python -c "
          from PIL import Image
          img = Image.open('resources/icon_1024.png').convert('RGBA')
          sizes = [16, 32, 48, 64, 128, 256]
          frames = [img.resize((s, s), Image.LANCZOS) for s in sizes]
          frames[-1].save('resources/QStraussVoice.ico', format='ICO', append_images=frames[:-1])
          print('ICO created')
          "

      - name: Build and package
        run: |
          .\build_win.bat
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: win-build
          path: QStrauss-Voice-win.zip

  # ── Create Release ───────────────────────────────────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-build

      - uses: actions/download-artifact@v4
        with:
          name: win-build

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            QStrauss-Voice-mac.zip
            QStrauss-Voice-win.zip
